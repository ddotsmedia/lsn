version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: lsn-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: littlesmarties
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: littlesmarties-backend:latest
    container_name: lsn-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/littlesmarties
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    image: littlesmarties-frontend:latest
    container_name: lsn-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
