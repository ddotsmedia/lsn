version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lsn-postgres
    environment:
      POSTGRES_USER: lsn
      POSTGRES_PASSWORD: littlesmarties_secure_password
      POSTGRES_DB: littlesmarties
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsn"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: littlesmarties-backend:latest
    container_name: lsn-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3011:3011"
    environment:
      DATABASE_URL: postgresql://lsn:littlesmarties_secure_password@postgres:5432/littlesmarties
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: littlesmarties-frontend:latest
    container_name: lsn-frontend
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backend_uploads:
