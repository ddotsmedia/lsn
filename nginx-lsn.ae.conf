# Nginx Configuration for lsn.ae Production Deployment
# Location: /etc/nginx/sites-available/lsn.ae
# Link: /etc/nginx/sites-enabled/lsn.ae

# ============================================================================
# PUBLIC WEBSITE - HTTP (Redirect to HTTPS)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name lsn.ae www.lsn.ae;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Allow Let's Encrypt challenges for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

# ============================================================================
# PUBLIC WEBSITE - HTTPS (SSL Enabled)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lsn.ae www.lsn.ae;

    # Enable compression for faster delivery
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # ========================================================================
    # SSL CONFIGURATION - Let's Encrypt Certificates
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/lsn.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lsn.ae/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lsn.ae/chain.pem;

    # Modern TLS configuration (A+ rating at ssllabs.com)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!DES:!RC4:!IDEA:!SEED:!aDSS:!SRP:!PSK;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========================================================================
    # SECURITY HEADERS
    # ========================================================================
    # Force HTTPS for 1 year (including subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy for privacy
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Permissions policy (formerly Feature-Policy)
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ========================================================================
    # LOGGING
    # ========================================================================
    access_log /var/log/nginx/lsn.ae-access.log;
    error_log /var/log/nginx/lsn.ae-error.log warn;

    # ========================================================================
    # RATE LIMITING ZONES
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # ========================================================================
    # REVERSE PROXY TO NEXT.JS FRONTEND (Port 3000)
    # ========================================================================
    location / {
        # Proxy settings
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Handle WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable caching for dynamic content
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ========================================================================
    # REVERSE PROXY TO EXPRESS API (Port 3001)
    # ========================================================================
    location /api/v1/ {
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy settings
        proxy_pass http://localhost:3001/api/v1/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (shorter for API)
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # No caching for API responses
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ========================================================================
    # STATIC FILE CACHING (JS, CSS, Images, Fonts)
    # ========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache static files for 30 days
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Compression
        gzip on;
        gzip_types application/javascript text/css;
    }

    # ========================================================================
    # DENY ACCESS TO SENSITIVE FILES
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# ADMIN PANEL - HTTP (Redirect to HTTPS)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name admin.lsn.ae;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

# ============================================================================
# ADMIN PANEL - HTTPS (SSL Enabled)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lsn.ae;

    # Enable compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # ========================================================================
    # SSL CONFIGURATION
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/lsn.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lsn.ae/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lsn.ae/chain.pem;

    # TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!DES:!RC4:!IDEA:!SEED:!aDSS:!SRP:!PSK;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========================================================================
    # SECURITY HEADERS (Admin has stricter requirements)
    # ========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================================================
    # LOGGING
    # ========================================================================
    access_log /var/log/nginx/admin.lsn.ae-access.log;
    error_log /var/log/nginx/admin.lsn.ae-error.log warn;

    # ========================================================================
    # RATE LIMITING FOR ADMIN (Stricter)
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;

    # ========================================================================
    # REVERSE PROXY TO NEXT.JS FRONTEND (Admin uses same frontend, different routes)
    # ========================================================================
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    # ADMIN API ENDPOINTS (Stricter rate limiting)
    # ========================================================================
    location /api/v1/ {
        # Stricter rate limiting for admin API
        limit_req zone=admin_limit burst=10 nodelay;

        proxy_pass http://localhost:3001/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ========================================================================
    # STATIC FILE CACHING FOR ADMIN
    # ========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, immutable";

        gzip on;
    }

    # ========================================================================
    # SECURITY - DENY SENSITIVE FILES
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# GLOBAL SECURITY - HTTP Headers
# ============================================================================
# Note: Some headers are set per-server above, but can also be set here

# Performance monitoring
map $upstream_response_time $response_time_minutes {
    "~^(?<minutes>[0-9]+)" $minutes;
}

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
# Test configuration: sudo nginx -t
# Reload: sudo systemctl reload nginx
# Restart: sudo systemctl restart nginx
